<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="S4F3-3TCH — open-source ComfyUI custom nodes for image generation">
  <defs>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="1280" height="4">
      <rect width="1280" height="2" fill="transparent"/><rect y="2" width="1280" height="2" fill="rgba(0,0,0,0.16)"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffb3" stop-opacity="0"/><stop offset="100%" stop-color="#00ffb3" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="phos"><feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="sc"><rect x="28" y="22" width="1224" height="592" rx="6"/></clipPath>
    <radialGradient id="glass" cx="36%" cy="22%" r="62%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <pattern id="phosmask" width="3" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" x="0" fill="#ff2a2a"/><rect width="1" height="1" x="1" fill="#2aff2a"/><rect width="1" height="1" x="2" fill="#2a2aff"/></pattern>
  </defs>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','JetBrains Mono',Consolas,monospace; }
    @keyframes sweep { 0% { transform: translateY(0); } 100% { transform: translateY(592px); } }
    @keyframes flicker { 0%,96%,100% { opacity: 1; } 97% { opacity: 0.97; } 98% { opacity: 0.995; } }
    @keyframes bootReveal { 0% { opacity: 0; } 100% { opacity: 0.92; } }
    @keyframes curBlink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes heartbeat { 0%,100% { transform: scale(1); opacity: 0.55; } 15% { transform: scale(1.3); opacity: 0.95; } 30% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.1); opacity: 0.8; } }
    @keyframes edgeGlow { 0% { stroke-dashoffset: 3450; } 100% { stroke-dashoffset: 0; } }
    @keyframes phosphorBloom { 0%,100% { opacity: 0; } 50% { opacity: 0.02; } }
    @keyframes signalPulse { 0% { stroke-dashoffset: 18; opacity: 0.85; } 100% { stroke-dashoffset: 0; opacity: 0.3; } }
    @keyframes nodeBlink { 0%,100% { opacity: 0.9; } 50% { opacity: 0.35; } }
    @keyframes forgeTravel { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(140px); opacity: 0; } }
    @keyframes cardForge { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes kanjiPulse { 0%,100% { opacity: 0.1; } 50% { opacity: 0.2; } }
    @keyframes rollBar { 0% { transform: translateY(-70px); } 100% { transform: translateY(540px); } }
    @keyframes dataBlink { 0%,100% { opacity: 0.12; } 50% { opacity: 0.7; } }
    @keyframes titleGlitch { 0%,90%,100% { transform: translate(0,0); } 91% { transform: translate(-2px,1px); } 94% { transform: translate(2px,-1px); } 97% { transform: translate(-1px,0); } }
    @keyframes okPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes linePulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
    @keyframes titleBreathe { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
    @keyframes crtBlank { 0%,90% { opacity: 0; } 91.5% { opacity: 1; } 97% { opacity: 1; } 98.6% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes crtLine { 0%,89.5% { opacity: 0; transform: scaleY(1); } 90.4% { opacity: 0.95; transform: scaleY(0.03); } 91.4% { opacity: 0; transform: scaleY(0.01); } 97.4% { opacity: 0; transform: scaleY(0.02); } 98.2% { opacity: 0.95; transform: scaleY(0.08); } 99.2% { opacity: 0; transform: scaleY(1); } 100% { opacity: 0; } }
    @keyframes genPulseA { 0% { transform: translate(0,0); opacity: 0; } 6% { opacity: 1; } 26% { transform: translate(36px,18px); opacity: 1; } 30%,100% { transform: translate(36px,18px); opacity: 0; } }
    @keyframes genPulseB { 0%,30% { transform: translate(0,0); opacity: 0; } 36% { opacity: 1; } 64% { transform: translate(-100px,52px); opacity: 1; } 70%,100% { transform: translate(-100px,52px); opacity: 0; } }
    @keyframes latentResolve { 0%,60% { opacity: 0.15; } 80% { opacity: 0.7; } 100% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="0" y="0" width="1280" height="640" rx="14" fill="#0b0f12"/>
  <rect x="2" y="2" width="1276" height="636" rx="13" fill="#1a242b" stroke="#2a3a42" stroke-width="1"/>
  <line x1="24" y1="13" x2="1256" y2="13" stroke="#2a3a42" stroke-width="0.5"/>
  <line x1="24" y1="620" x2="1256" y2="620" stroke="#2a3a42" stroke-width="0.5"/>
  <rect x="28" y="22" width="1224" height="592" rx="6" fill="#070a0c"/>

  <g clip-path="url(#sc)">
    <g stroke="url(#grid)" stroke-width="0.6" opacity="0.5">
      <line x1="640" y1="422" x2="40" y2="614"/><line x1="640" y1="422" x2="220" y2="614"/>
      <line x1="640" y1="422" x2="400" y2="614"/><line x1="640" y1="422" x2="540" y2="614"/>
      <line x1="640" y1="422" x2="640" y2="614"/><line x1="640" y1="422" x2="740" y2="614"/>
      <line x1="640" y1="422" x2="900" y2="614"/><line x1="640" y1="422" x2="1060" y2="614"/>
      <line x1="640" y1="422" x2="1240" y2="614"/>
    </g>
    <g stroke="#00ffb3" stroke-width="0.5" opacity="0.2">
      <line x1="120" y1="521" x2="1160" y2="521"/><line x1="80" y1="567" x2="1200" y2="567"/><line x1="48" y1="605" x2="1232" y2="605"/>
    </g>
    <!-- ambient "the wired" data nodes -->
    <g fill="#00ffb3">
      <circle cx="360" cy="561" r="1.6" style="animation: dataBlink 2.6s ease-in-out 0s infinite;"/>
      <circle cx="700" cy="593" r="1.6" style="animation: dataBlink 3.1s ease-in-out 0.8s infinite;"/>
      <circle cx="980" cy="543" r="1.6" style="animation: dataBlink 2.4s ease-in-out 1.4s infinite;"/>
      <circle cx="498" cy="601" r="1.6" fill="#5050ff" style="animation: dataBlink 3.4s ease-in-out 2s infinite;"/>
    </g>
    <!-- CRT roll bar: soft band drifting down the screen -->
    <rect x="28" y="22" width="1224" height="46" fill="#9fffd8" opacity="0.035" style="animation: rollBar 7s linear infinite;"/>
    <rect x="28" y="22" width="1224" height="3" fill="#00ffb3" opacity="0.05" style="animation: sweep 9s linear infinite;"/>
    <rect x="28" y="22" width="1224" height="592" fill="#ffffff" opacity="0" style="animation: phosphorBloom 8s ease-in-out infinite;"/>
  </g>
  <rect x="28" y="22" width="1224" height="592" rx="6" fill="url(#scan)"/>
  <rect x="28" y="22" width="1224" height="592" rx="6" fill="url(#vig)"/>
  <rect x="28" y="22" width="1224" height="592" rx="6" fill="url(#phosmask)" opacity="0.04"/>
  <rect x="28" y="22" width="1224" height="592" rx="6" fill="url(#glass)"/>
  <rect x="28" y="22" width="1224" height="592" rx="6" fill="none" stroke="#00ffb3" stroke-width="1" opacity="0.07" stroke-dasharray="22,3610" style="animation: edgeGlow 11s linear infinite;"/>
  <rect x="28" y="22" width="1224" height="592" rx="6" fill="none" stroke="#1a242b"/>

  <g stroke="#00ffb3" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M56 54 h26 M56 54 v26"/><path d="M1224 54 h-26 M1224 54 v26"/>
    <path d="M56 582 h26 M56 582 v-26"/><path d="M1224 582 h-26 M1224 582 v-26"/>
  </g>

    <text x="1204" y="98" text-anchor="end" font-size="40" fill="#8c6cd0" opacity="0.13" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" style="animation: kanjiPulse 6s ease-in-out infinite;">描</text>
  <g style="animation: flicker 7s infinite;">
    <text x="640" y="74" text-anchor="middle" font-size="13" fill="#5a6b73" letter-spacing="7" filter="url(#phos)" style="font-family: 'Times New Roman','Times','Matisse',serif; font-weight: 700; transform: scaleX(0.82); transform-origin: 640px 74px; animation: titleBreathe 6s ease-in-out infinite;">I T A S H A . C O R P</text>
    <g font-size="60" font-weight="bold" letter-spacing="6" text-anchor="middle">
      <text x="643" y="140" fill="#8c6cd0" opacity="0.5" filter="url(#soft)" style="animation: titleGlitch 5.5s steps(1) infinite; transform-origin: 640px 140px;">S4F3-3TCH</text>
      <text x="637" y="140" fill="#00ffb3" opacity="0.5" filter="url(#soft)" style="animation: titleGlitch 6.3s steps(1) 0.1s infinite; transform-origin: 640px 140px;">S4F3-3TCH</text>
      <text x="640" y="140" fill="#e9f7ff" filter="url(#glow)" style="animation: titleBreathe 4s ease-in-out infinite;">S4F3-3TCH</text>
    </g>
    <text x="640" y="172" text-anchor="middle" font-size="14" fill="#8c6cd0" letter-spacing="3" filter="url(#phos)">ComfyUI custom nodes · precision tools for precision work</text>

    <g filter="url(#phos)">
      <text x="64" y="222" font-size="12" fill="#5a6b73">3tch --load comfyui nodes ───────────────────</text>
      <text x="84" y="250" font-size="12.5" fill="#00ffb3" style="animation: bootReveal 0.35s ease-out 0.2s both;, linePulse 3.6s ease-in-out 0.0s infinite">&gt; register  S4F3 node category</text>
      <text x="544" y="250" font-size="12.5" fill="#6fb89a" style="animation: bootReveal 0.35s ease-out 0.2s both, okPulse 2s ease-in-out 0.6s infinite;">[ OK ]</text>
      <text x="84" y="276" font-size="12.5" fill="#00ffb3" style="animation: bootReveal 0.35s ease-out 0.5s both;, linePulse 3.6s ease-in-out 0.4s infinite">&gt; author    authoring + publish nodes</text>
      <text x="544" y="276" font-size="12.5" fill="#6fb89a" style="animation: bootReveal 0.35s ease-out 0.5s both, okPulse 2s ease-in-out 1.0s infinite;">[ OK ]</text>
      <text x="84" y="302" font-size="12.5" fill="#00ffb3" style="animation: bootReveal 0.35s ease-out 0.8s both;, linePulse 3.6s ease-in-out 0.8s infinite">&gt; validate  pydantic schema on inputs</text>
      <text x="544" y="302" font-size="12.5" fill="#6fb89a" style="animation: bootReveal 0.35s ease-out 0.8s both, okPulse 2s ease-in-out 1.4s infinite;">[ OK ]</text>
      <text x="84" y="328" font-size="12.5" fill="#00ffb3" style="animation: bootReveal 0.35s ease-out 1.1s both;, linePulse 3.6s ease-in-out 1.2s infinite">&gt; template  jinja2 · 18 workflow templates</text>
      <text x="544" y="328" font-size="12.5" fill="#6fb89a" style="animation: bootReveal 0.35s ease-out 1.1s both, okPulse 2s ease-in-out 1.8s infinite;">[ OK ]</text>
      <text x="84" y="354" font-size="12.5" fill="#00ffb3" style="animation: bootReveal 0.35s ease-out 1.4s both;, linePulse 3.6s ease-in-out 1.6s infinite">&gt; render    latent -> image · repeatable</text>
      <text x="544" y="354" font-size="12.5" fill="#6fb89a" style="animation: bootReveal 0.35s ease-out 1.4s both, okPulse 2s ease-in-out 2.2s infinite;">[ OK ]</text>
      <text x="64" y="382" font-size="12" fill="#5a6b73">────────────────────────────────────────────</text>
      <text x="64" y="416" font-size="13" fill="#6fb89a">root@itasha:3tch$<tspan dx="6" fill="#00ffb3" style="animation: curBlink 1.1s step-end infinite;">█</tspan></text>
      <text x="64" y="448" font-size="11" fill="#5a6b73" letter-spacing="2">good tools just work · open source</text>
    </g>

    <g transform="translate(880, 222)" style="animation: flicker 9s infinite;">
      <text x="86" y="180" fill="#8c6cd0" font-size="52" font-family="'Noto Sans JP','Yu Gothic',sans-serif" style="animation: kanjiPulse 6s ease-in-out infinite;">描</text>

      <!-- node graph: three ComfyUI-style nodes with title bars + ports -->
      <!-- NODE 1: LOAD -->
      <g filter="url(#phos)">
        <rect x="0" y="6" width="60" height="34" rx="3" fill="#0c1417" stroke="#00ffb3" stroke-width="1.1"/>
        <rect x="0" y="6" width="60" height="9" rx="3" fill="#00ffb3" opacity="0.18"/>
        <text x="6" y="13" font-size="6.5" fill="#00ffb3" letter-spacing="0.6">LOAD</text>
        <text x="6" y="27" font-size="6" fill="#5a6b73">checkpoint</text>
        <circle cx="60" cy="30" r="2.2" fill="#00ffb3"/>
      </g>
      <!-- NODE 2: SAMPLE -->
      <g transform="translate(96, 40)" filter="url(#phos)">
        <rect x="0" y="0" width="64" height="38" rx="3" fill="#0c1417" stroke="#00ffb3" stroke-width="1.1"/>
        <rect x="0" y="0" width="64" height="9" rx="3" fill="#00ffb3" opacity="0.18"/>
        <text x="6" y="7" font-size="6.5" fill="#00ffb3" letter-spacing="0.6">KSAMPLER</text>
        <text x="6" y="22" font-size="6" fill="#5a6b73">steps · cfg</text>
        <text x="6" y="33" font-size="6" fill="#5a6b73">seed</text>
        <circle cx="0" cy="14" r="2.2" fill="#00ffb3"/>
        <circle cx="64" cy="20" r="2.2" fill="#00ffb3"/>
      </g>
      <!-- NODE 3: DECODE (VAE) -->
      <g transform="translate(0, 92)" filter="url(#phos)">
        <rect x="0" y="0" width="60" height="32" rx="3" fill="#0c1417" stroke="#00ffb3" stroke-width="1.1"/>
        <rect x="0" y="0" width="60" height="9" rx="3" fill="#00ffb3" opacity="0.18"/>
        <text x="6" y="7" font-size="6.5" fill="#00ffb3" letter-spacing="0.6">VAE DECODE</text>
        <text x="6" y="24" font-size="6" fill="#5a6b73">latent -&gt; img</text>
        <circle cx="0" cy="20" r="2.2" fill="#00ffb3"/>
        <circle cx="60" cy="20" r="2.2" fill="#00ffb3"/>
      </g>

      <!-- bezier links between nodes -->
      <path d="M60 36 C 84 36, 84 54, 96 54" fill="none" stroke="#00ffb3" stroke-width="1" opacity="0.5"/>
      <path d="M160 60 C 184 60, 30 92, 60 112" fill="none" stroke="#00ffb3" stroke-width="1" opacity="0.5"/>

      <!-- generation pulse riding the links node->node -->
      <circle cx="60" cy="36" r="2.6" fill="#e9f7ff" filter="url(#glow)" style="animation: genPulseA 3.4s ease-in-out infinite;"/>
      <circle cx="160" cy="60" r="2.6" fill="#e9f7ff" filter="url(#glow)" style="animation: genPulseB 3.4s ease-in-out infinite;"/>

      <!-- latent PREVIEW tile resolving -->
      <g transform="translate(96, 96)" filter="url(#phos)">
        <rect x="0" y="0" width="64" height="64" rx="3" fill="#0c1417" stroke="#00ffb3" stroke-width="1.1"/>
        <rect x="0" y="0" width="64" height="9" rx="3" fill="#00ffb3" opacity="0.18"/>
        <text x="6" y="7" font-size="6" fill="#00ffb3" letter-spacing="0.6">PREVIEW</text>
        <!-- latent scanline-resolve -->
        <g opacity="0.7" style="animation: latentResolve 3.4s ease-in-out infinite;">
          <rect x="6" y="14" width="52" height="44" rx="1" fill="url(#grid)" opacity="0.4"/>
          <rect x="6" y="14" width="52" height="6" fill="#00ffb3" opacity="0.5"/>
          <rect x="6" y="24" width="52" height="5" fill="#9ee5e5" opacity="0.35"/>
          <rect x="6" y="34" width="52" height="6" fill="#00ffb3" opacity="0.4"/>
          <rect x="6" y="46" width="52" height="6" fill="#9ee5e5" opacity="0.3"/>
        </g>
        <text x="58" y="56" text-anchor="end" font-size="5.5" fill="#6fb89a" style="animation: okPulse 2s ease-in-out 1.4s infinite;">RENDERED</text>
      </g>
    </g>
  </g>

  <g>
    <circle cx="56" cy="627" r="3.5" fill="#6fb89a" opacity="0.7" style="animation: heartbeat 2.4s ease-in-out infinite; transform-origin: 56px 627px;"/>
    <circle cx="71" cy="627" r="3" fill="#00ffb3" opacity="0.45"/>
    <circle cx="86" cy="627" r="3" fill="#5050ff" opacity="0.4"/>
    <text x="108" y="627" font-size="9" fill="#3a4a52" letter-spacing="3.2" dominant-baseline="central">ITASHA.CORP</text>
    <text x="640" y="627" font-size="9" fill="#3a4a52" letter-spacing="3" dominant-baseline="central" text-anchor="middle">OPEN-NODE · present day · present time</text>
    <text x="1208" y="627" font-size="9" fill="#3a4a52" letter-spacing="2.4" dominant-baseline="central" text-anchor="end">CRT-IC v2</text>
    <circle cx="1224" cy="627" r="4" fill="#6fb89a" opacity="0.5"/>
    <circle cx="1224" cy="627" r="2" fill="#6fb89a" opacity="0.95" style="animation: heartbeat 2.4s ease-in-out infinite; transform-origin: 1224px 627px;"/>
  </g>
  <rect x="28" y="22" width="1224" height="592" rx="6" fill="#050608" opacity="0" style="animation: crtBlank 14s ease-in-out infinite;"/>
  <rect x="28" y="316.5" width="1224" height="3" fill="#e9f7ff" opacity="0" style="animation: crtLine 14s ease-in-out infinite; transform-origin: 640px 317.5px;"/>
</svg>
